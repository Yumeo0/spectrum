name: Lint code

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      PROTOS_CDN: ${{ secrets.PROTOS_CDN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download proto files
        run: |
          curl -sSL "$PROTOS_CDN/packetIds.json" -o proto/packetIds.json
          curl -sSL "$PROTOS_CDN/protos.proto" -o proto/protos.proto

      - name: Set up Rust
        run: |
          rustup update nightly
          rustup default nightly
          rustup component add clippy

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
