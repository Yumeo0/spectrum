[package]
name = "spectrum"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
aes = "0.8.4"
cipher = { version = "0.4.4", features = ["alloc", "block-padding"] }
crc32fast = "1.4.2"
etherparse = "0.18.0"
kcp = "0.6.0"
miniz_oxide = "0.8.9"
num_enum = "0.7.4"
protobuf = "3.7.2"
rsa = { version = "0.9.8", features = ["pem"] }
strum_macros = "0.27.1"
thiserror = "2.0.12"

[build-dependencies]
quote = "1.0.40"
serde_json = "1.0"
protobuf-codegen = "3.7.2"
